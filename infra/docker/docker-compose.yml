services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vme_admin
      POSTGRES_PASSWORD: vme_secure_dev_password_change_in_prod
      POSTGRES_DB: virtual_mendez_empire
    ports:
      - "5432:5432"
    volumes:
      - vme_postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vme_admin -d virtual_mendez_empire"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vme_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "vme_redis_dev_secret"]
    ports:
      - "6379:6379"
    volumes:
      - vme_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vme_redis_dev_secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: vme_temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=vme_admin
      - POSTGRES_PWD=vme_secure_dev_password_change_in_prod
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.30.0
    container_name: vme_temporal_ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"

volumes:
  vme_postgres_data:
  vme_redis_data:

